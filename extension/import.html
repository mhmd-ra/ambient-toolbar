<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Import &amp; export settings – Ambient Toolbar</title>
<style>
  html { color-scheme: dark; }
  body { margin: 0; background: #1b1b1b; color: #f1f1f1; font: 14px Roboto, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 560px; margin: 48px auto; padding: 0 20px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { color: #9a9a9a; margin: 0 0 18px; }
  .drop { border: 2px dashed #555; border-radius: 10px; padding: 28px; text-align: center; cursor: pointer; }
  .drop.over { border-color: #3ea6ff; background: #22303d; }
  .drop b { color: #3ea6ff; }
  textarea { width: 100%; height: 120px; margin-top: 14px; background: #232323; color: #f1f1f1; border: 1px solid #444; border-radius: 6px; padding: 8px; font: 12px ui-monospace, Consolas, monospace; box-sizing: border-box; }
  button { margin-top: 10px; background: #3ea6ff; color: #000; border: 0; border-radius: 6px; padding: 8px 16px; font: inherit; font-weight: 600; cursor: pointer; }
  #status { margin-top: 16px; padding: 10px 12px; border-radius: 6px; display: none; }
  #status.ok { display: block; background: #1f3a26; color: #a6f0b8; }
  #status.err { display: block; background: #3a1f1f; color: #f0a6a6; }
</style>
</head>
<body>
<main>
  <h1>Export settings</h1>
  <p>Save your current Ambient Toolbar settings as a file, to back them up or share them.</p>
  <button id="export">Export settings</button>
  <hr style="border:0;border-top:1px solid #333;margin:28px 0">
  <h1>Import settings</h1>
  <p>Choose an Ambient Light for YouTube settings export, or an Ambient Toolbar settings file. Ambient Light's values are converted to matching toolbar settings.</p>
  <label class="drop" id="drop"><b>Choose a file</b> or drop it here<input type="file" id="file" accept=".json,application/json" hidden></label>
  <textarea id="paste" placeholder="…or paste the JSON here"></textarea>
  <button id="apply">Import pasted text</button>
  <div id="status"></div>
</main>
<script src="settings.js"></script>
<script src="import.js"></script>
</body>
</html>
